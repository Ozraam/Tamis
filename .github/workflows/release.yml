name: Release

# Pushing a tag such as v0.2.0 builds Tamis.app, wraps it in a DMG and a zip, and
# publishes them as a GitHub release. The tag must match pyproject.toml's version.
# Once the release exists, Linux and Windows builds (unsigned, dist/Tamis/ as a
# .tar.gz and a .zip) are added to it; if one of them fails, the macOS release stays.
#
# No Apple Developer account is needed: the app is signed ad hoc and not notarized,
# so Gatekeeper blocks it the first time (the release notes say how to open it).
# If these secrets are set, it is signed with a Developer ID and notarized instead:
#   MACOS_CERTIFICATE           the "Developer ID Application" certificate and key, as a base64 .p12
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   MACOS_SIGN_IDENTITY         "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY                  an App Store Connect API key, as a base64 .p8
#   NOTARY_KEY_ID, NOTARY_ISSUER  that key's id and issuer id

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[build,dev]"
      - run: ruff check .
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check the tag against the version
        run: |
          version=$(python -c "import tamis; print(tamis.__version__)")
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml" >&2
            exit 1
          fi
      - name: Import the signing certificate
        if: env.SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - run: ./scripts/build_app.sh
      - name: Package (signed with a Developer ID and notarized if the secrets are set)
        env:
          TAMIS_SIGN_IDENTITY: ${{ env.SIGNING == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          TAMIS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          TAMIS_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [[ -n "$NOTARY_KEY" && -n "$TAMIS_SIGN_IDENTITY" ]]; then
            export TAMIS_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
            echo "$NOTARY_KEY" | base64 --decode > "$TAMIS_NOTARY_KEY"
          fi
          ./scripts/package_macos.sh
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if [[ "$SIGNING" != "true" ]]; then
            cat > "$notes" <<'NOTES'
          **Installing:** open the DMG and drag Tamis to Applications. Tamis isn't notarized by Apple, so macOS
          blocks it the first time: try to open it once, then go to **System Settings › Privacy & Security** and
          click **Open Anyway** (or run `xattr -dr com.apple.quarantine /Applications/Tamis.app` in Terminal).
          NOTES
          else
            : > "$notes"
          fi
          cat >> "$notes" <<'NOTES'

          **Linux and Windows:** unpack the archive and run `Tamis` (or `Tamis.exe`) from the `Tamis` folder. These
          builds aren't signed (Windows SmartScreen warns the first time: **More info › Run anyway**) and get less
          testing than the macOS app.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/Tamis-*.dmg dist/Tamis-*.zip \
            --title "Tamis ${GITHUB_REF_NAME#v}" --notes-file "$notes" --generate-notes
      - name: Remove the keychain
        if: always() && env.SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # Added to the release the macOS job published (it checks the tag and runs the tests).
  others:
    needs: macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: pip install -e ".[build]"
      - run: ./scripts/build_app.sh
      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          cd dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test -f Tamis/Tamis.exe
            archive="Tamis-$version-windows.zip"
            7z a -tzip "$archive" Tamis
          else
            test -f Tamis/Tamis
            # tar keeps the executable bits, which a zip from here wouldn't.
            archive="Tamis-$version-linux.tar.gz"
            tar -czf "$archive" Tamis
          fi
          echo "ARCHIVE=dist/$archive" >> "$GITHUB_ENV"
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
