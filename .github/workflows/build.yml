name: Build

# Builds the app with PyInstaller on Linux and Windows for pull requests into master,
# so a change that breaks the bundle there shows up before it is merged. Each build
# is uploaded as an artifact of the run (Actions › the run › Artifacts), kept 14 days.
# These builds are unsigned and only checked from source: macOS is the supported platform.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    defaults:
      run:
        # build_app.sh is a bash script; on Windows this is Git Bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: pip install -e ".[build]"
      - run: ./scripts/build_app.sh
      - name: Check the bundle
        run: |
          exe=dist/Tamis/Tamis
          [[ "$RUNNER_OS" == "Windows" ]] && exe=dist/Tamis/Tamis.exe
          test -f "$exe" || { echo "$exe is missing" >&2; exit 1; }
          echo "Built $exe ($(du -sh dist/Tamis | cut -f1))"
      - uses: actions/upload-artifact@v7
        with:
          name: Tamis-${{ matrix.name }}-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.sha }}
          path: dist/Tamis/
          retention-days: 14
          if-no-files-found: error
